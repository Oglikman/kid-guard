<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked by KidGuard</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#5b6670; --accent:#c62828; --card:#f4f6f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --fg:#e8ecef; --muted:#9aa5ae; --accent:#ff6b6b; --card:#1d2329; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:grid; place-items:center; min-height:100vh; }
  main { max-width:520px; padding:32px 16px; }
  h1 { color:var(--accent); font-size:28px; margin:0 0 8px; }
  .card { background:var(--card); border-radius:8px; padding:12px 16px; margin:16px 0; }
  .muted { color:var(--muted); font-size:14px; }
  code { word-break:break-all; }
  button { font:inherit; padding:8px 16px; border-radius:6px; border:1px solid var(--muted); background:transparent; color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>This page is blocked</h1>
  <p id="why"></p>
  <div class="card"><div class="muted">Site</div><code id="host"></code></div>
  <p class="muted" id="reason"></p>
  <button id="retry" hidden>Try again</button>
  <p class="muted" id="auto" hidden>This page checks again every few seconds and opens the site by itself if KidGuard allows it.</p>
  <p class="muted">If you think this is a mistake, ask a parent or guardian. They can change the rules in KidGuard.</p>
</main>
<script src="blocked.js" type="module"></script>
</body>
</html>
