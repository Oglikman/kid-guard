<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidGuard</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#5b6670; --ok:#2e7d32; --bad:#c62828; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --fg:#e8ecef; --muted:#9aa5ae; --ok:#66bb6a; --bad:#ff6b6b; --warn:#ffb74d; } }
  body { width:280px; margin:0; padding:12px 16px; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:16px; margin:0 0 8px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); margin-top:8px; }
  #profile.normal { color:var(--ok); } #profile.strict { color:var(--bad); }
</style>
</head>
<body>
  <h1>KidGuard</h1>
  <div class="row"><span class="muted">Companion app</span><span id="conn">checking...</span></div>
  <div class="row"><span class="muted">Person at screen</span><span id="label">-</span></div>
  <div class="row"><span class="muted">Profile</span><strong id="profile">-</strong></div>
  <div class="warn" id="warn" hidden></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
